name: Test

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: beetforge_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/beetforge_test
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/beetforge_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Debug URLs
        run: |
          echo "DATABASE_URL set? -> ${DATABASE_URL:+yes}"
          echo "DIRECT_URL set? -> ${DIRECT_URL:+yes}"
          node -e "console.log({DATABASE_URL: !!process.env.DATABASE_URL, DIRECT_URL: !!process.env.DIRECT_URL})"

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Run tests
        run: pnpm test
